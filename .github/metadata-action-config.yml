branches-template:
  - main: "{{ref-name}}-{{timestamp}}-{{github.context.runNumber}}, {{ref-name}}-snapshot"
  - "feature/*": "{{ref-name}}-{{timestamp}}-{{github.context.runNumber}}.{{dist-tag}}, {{ref-name}}-{{github.context.sha}}"
  - "release/*": "{{ref-name}}-{{timestamp}}-{{github.context.runNumber}}.{{dist-tag}}"
  - "hotfix/*": "{{ref-name}}-{{timestamp}}-{{github.context.runNumber}}"
  - "bugfix/*": "{{ref-name}}-{{timestamp}}-{{github.context.runNumber}}"

distribution-tag:
  - main: "latest"
  - "release/*": "next"
  - "feature/*": "beta"
  - tag: "stable"

default-template: "{{ref-name}}-{{timestamp}}-{{github.context.runNumber}}"
