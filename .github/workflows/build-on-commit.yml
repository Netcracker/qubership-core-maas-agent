name: Build and Publish

on:
  push:

jobs:
  prepare-variables:
    runs-on: ubuntu-latest
    steps:
      - id: tag_build_number
        run: echo "tag=$(echo ${{github.ref_name}} | tr -cs 'a-zA-Z0-9' '-')$(date +'%Y%m%d%H%M%S')-${{ github.run_number }}" >> $GITHUB_OUTPUT
      - id: tag_snapshot
        run: echo "tag=$(echo ${{github.ref_name}} | tr -cs 'a-zA-Z0-9' '-')snapshot" >> $GITHUB_OUTPUT
      - id: repo
        run: echo "repo=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
    outputs:
      tag_build_number: ${{ steps.tag_build_number.outputs.tag }}
      tag_snapshot: ${{ steps.tag_snapshot.outputs.tag }}
      repo: ${{ steps.repo.outputs.repo }}
  build:
    runs-on: ubuntu-latest
    needs: prepare-variables
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.24.2'

    - name: Install Sonar Scanner
      run: npm install -g sonar-scanner

    - name: Build
      working-directory: maas-agent-service
      run: CGO_ENABLED=0 go build

    - name: Test with coverage
      working-directory: maas-agent-service
      run: go test -v ./... -coverprofile coverage.out

    - name: Upload coverage report to SonarCloud
      working-directory: maas-agent-service
      run: |
        sonar-scanner \
          -Dproject.settings=sonar-project.properties \
          -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }} \
          -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }} \
          -Dsonar.host.url=${{ vars.SONAR_HOST_URL }} \
          -Dsonar.go.coverage.reportPaths=coverage.out
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  docker-build:
    needs: prepare-variables
    uses: netcracker/qubership-core-infra/.github/workflows/docker-build.yaml@docker_build
    with:
      tags: ${{ needs.prepare-variables.outputs.tag_build_number }}, ${{ needs.prepare-variables.outputs.tag_snapshot }}
      dry-run: false

