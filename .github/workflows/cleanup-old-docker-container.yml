name: Cleanup old Docker images

on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Print the versions that would be deleted without deleting them"
        type: boolean
        default: true
      debug:
        description: "Print debug logs of the cleanup action"
        type: boolean
        default: false

permissions: {}

jobs:
  cleanup:
    permissions: {}
    uses: Netcracker/qubership-core-infra/.github/workflows/docker-cleanup.yaml@270d0e6b9b8a440f2dba064ccc6d67f7635cf9e9 # feat/docker-cleanup-poc
    with:
      dry-run: ${{ inputs.dry-run == true }}
      debug: ${{ inputs.debug == true }}
    secrets:
      GH_RWD_PACKAGE_TOKEN: ${{ secrets.GH_RWD_PACKAGE_TOKEN }}
